<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>US AMTRAK ULTRA DASHBOARD V13</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #eef2f6;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .city-pill-active {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%) !important;
      color: #ffffff !important;
      border-color: #4338ca !important;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    .main-tab-active {
      background-color: #0f172a !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    .day-filter-active {
      background-color: #4f46e5 !important;
      color: #ffffff !important;
      border-color: #4f46e5 !important;
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
    }

    .card-elevated {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }
    .card-elevated:hover {
      border-color: #cbd5e1;
      box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.08);
    }
  </style>
</head>
<body class="antialiased pb-36">

  <!-- ================= TOP STICKY DASHBOARD HEADER ================= -->
  <header class="bg-[#0B0F19] text-white sticky top-0 z-40 shadow-xl border-b border-slate-800">
    <div class="max-w-3xl mx-auto px-4 pt-3.5 pb-3">
      
      <!-- Top Row: Title & Global Actions -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30 shrink-0">
            <i class="fa-solid fa-train-subway text-xl"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-black tracking-tight text-white">US AMTRAK MASTER</h1>
              <span class="text-[11px] font-black bg-amber-400 text-slate-950 px-2 py-0.5 rounded-md">V13 ULTRA</span>
            </div>
            <p class="text-xs text-slate-400 font-medium">12/17 ~ 1/6 (21일) • 아웃도어/폴로 특가 & 실시간 대안 스왑</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="shareLink()" class="text-xs sm:text-sm font-extrabold text-slate-950 bg-amber-400 hover:bg-amber-300 active:scale-95 px-3.5 py-2 rounded-xl shadow-md transition flex items-center gap-1.5">
            <i class="fa-solid fa-share-nodes"></i> 공유링크
          </button>
          <button onclick="resetToDefault()" title="초기화" class="text-xs font-bold text-slate-300 bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl border border-slate-700 transition">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>

      <!-- Second Row: 7 Cities Horizontal Selector -->
      <div id="routeTabs" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>
    </div>

    <!-- Third Row: 4-Mode View Switcher Bar -->
    <div class="bg-white border-b border-slate-200 px-4 py-2 text-slate-800">
      <div class="max-w-3xl mx-auto grid grid-cols-4 gap-1.5 bg-slate-100 p-1 rounded-2xl">
        <button onclick="setMainView('schedule')" id="vTab-schedule" class="py-2 px-2 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center justify-center gap-1.5 main-tab-active">
          <i class="fa-regular fa-calendar-check"></i> <span>일정표</span>
        </button>
        <button onclick="setMainView('alternatives')" id="vTab-alternatives" class="py-2 px-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> <span>대안넣기</span>
        </button>
        <button onclick="setMainView('shopping')" id="vTab-shopping" class="py-2 px-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-shirt text-amber-600"></i> <span>쇼핑바이블</span>
        </button>
        <button onclick="setMainView('transit')" id="vTab-transit" class="py-2 px-2 rounded-xl text-xs sm:text-sm font-extrabold text-slate-600 hover:text-slate-900 transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-shield-halved text-emerald-600"></i> <span>교통/치안</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT CONTAINER ================= -->
  <main class="max-w-3xl mx-auto px-4 mt-4 space-y-5" id="mainContent"></main>

  <!-- ================= MODAL 1: SWAP / INSERT ALTERNATIVE ================= -->
  <div id="swapModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg p-5 sm:p-6 space-y-4 shadow-2xl max-h-[88vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-200 pb-3 shrink-0">
        <div>
          <h3 class="text-base sm:text-lg font-black text-slate-900" id="swapModalTitle">🔄 다른 추천 장소로 교체 / 추가</h3>
          <p class="text-xs text-slate-500 font-medium mt-0.5" id="swapModalSubtitle">원하는 대안을 클릭하면 일정에 즉시 반영됩니다.</p>
        </div>
        <button onclick="closeSwapModal()" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center text-base">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Target Selector Bar (When opened from Catalog) -->
      <div id="swapTargetSelectorBox" class="bg-indigo-50/80 border border-indigo-100 p-3.5 rounded-2xl space-y-2.5 shrink-0">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-extrabold text-indigo-950 block mb-1">1. 날짜 선택</label>
            <select id="swapDaySelect" onchange="populateSwapTargetItems()" class="w-full text-xs sm:text-sm p-2.5 border border-indigo-200 rounded-xl bg-white font-bold text-slate-800 outline-none"></select>
          </div>
          <div>
            <label class="text-xs font-extrabold text-indigo-950 block mb-1">2. 반영 방식 (새로 추가 vs 기존 교체)</label>
            <select id="swapItemSelect" class="w-full text-xs sm:text-sm p-2.5 border border-indigo-200 rounded-xl bg-white font-bold text-slate-800 outline-none"></select>
          </div>
        </div>
      </div>

      <!-- Scrollable Alternatives List inside Modal -->
      <div id="swapModalList" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
    </div>
  </div>

  <!-- ================= MODAL 2: EDIT SCHEDULE ITEM ================= -->
  <div id="editModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-5 sm:p-6 space-y-3.5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-200 pb-3">
        <h3 class="text-base font-black text-slate-900"><i class="fa-solid fa-pen-to-square text-indigo-600 mr-1.5"></i>일정 직접 수정</h3>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="editSchIdx">
      <input type="hidden" id="editItemIdx">
      
      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="text-xs font-extrabold text-slate-600">시간대</label>
          <input type="text" id="editTime" class="w-full text-sm font-bold p-2.5 border border-slate-300 rounded-xl mt-1 outline-none focus:border-indigo-600">
        </div>
        <div>
          <label class="text-xs font-extrabold text-slate-600">치안 등급</label>
          <select id="editSafetyLevel" class="w-full text-sm font-bold p-2.5 border border-slate-300 rounded-xl mt-1 bg-white outline-none">
            <option value="G">🟢 치안 양호</option>
            <option value="Y">🟡 주의 필요</option>
            <option value="R">🔴 위험/야간주의</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-extrabold text-slate-600">일정 제목 / 장소명</label>
        <input type="text" id="editItemTitle" class="w-full text-sm font-bold p-2.5 border border-slate-300 rounded-xl mt-1 outline-none focus:border-indigo-600">
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="text-xs font-extrabold text-slate-600">이동 & 소요시간</label>
          <input type="text" id="editDuration" class="w-full text-sm p-2.5 border border-slate-300 rounded-xl mt-1 outline-none">
        </div>
        <div>
          <label class="text-xs font-extrabold text-slate-600">예상 비용</label>
          <input type="text" id="editCost" class="w-full text-sm p-2.5 border border-slate-300 rounded-xl mt-1 outline-none">
        </div>
      </div>

      <div>
        <label class="text-xs font-extrabold text-slate-600">치안 & 실전 꿀팁 메모</label>
        <textarea id="editSafety" rows="2" class="w-full text-sm p-2.5 border border-slate-300 rounded-xl mt-1 outline-none"></textarea>
      </div>

      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
        <span class="text-xs font-extrabold text-slate-800"><i class="fa-solid fa-taxi text-amber-500 mr-1.5"></i>Uber / Lyft 원클릭 호출 버튼 표시</span>
        <input type="checkbox" id="editNeedsRide" class="w-5 h-5 accent-indigo-600 rounded">
      </div>

      <div class="bg-indigo-50/70 p-3.5 rounded-2xl border border-indigo-100 space-y-2">
        <div class="text-xs font-black text-indigo-950"><i class="fa-solid fa-map-location-dot text-indigo-600 mr-1"></i> 구글 지도 검색어 설정</div>
        <div>
          <label class="text-[11px] font-bold text-slate-600">도착지 장소명 (필수 - 수정 시 지도 즉시 반영)</label>
          <input type="text" id="editDest" class="w-full text-sm p-2 border border-slate-300 rounded-xl bg-white mt-0.5 outline-none">
        </div>
        <div>
          <label class="text-[11px] font-bold text-slate-600">출발지 장소명 (선택 - 입력 시 길찾기 경로 연동)</label>
          <input type="text" id="editOrigin" class="w-full text-sm p-2 border border-slate-300 rounded-xl bg-white mt-0.5 outline-none">
        </div>
      </div>

      <button onclick="saveModalChanges()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3.5 rounded-2xl text-sm shadow-lg transition">
        저장 및 지도 업데이트
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'amtrak_ultra_v13_master';
    let currentRouteIndex = 0;
    let currentMainView = 'schedule'; // 'schedule' | 'alternatives' | 'shopping' | 'transit'
    let currentDayFilter = -1; // -1 = All days, 0..N = specific day index
    let currentTierFilter = 'all';

    // Compact Builders to keep code clean and fast
    const I = (time, title, origin, dest, cost, duration, safetyLevel, safetyNote, needsRide=false) => ({
      time, title, origin, dest, cost, duration, safetyLevel, safetyNote, needsRide, done: false
    });
    const A = (name, desc, cost, duration, dest, safetyLevel='G', safetyNote='', needsRide=false) => ({
      name, desc, cost, duration, dest, safetyLevel, safetyNote, needsRide
    });

    const makeUberUrl = (dest) => `https://m.uber.com/ul/?action=setPickup&dropoff[formatted_address]=${encodeURIComponent(dest || '')}`;
    const makeLyftUrl = (dest) => `https://lyft.com/ride?id=lyft&destination[address]=${encodeURIComponent(dest || '')}`;
    const makeMapUrl = (origin, dest) => {
      if (!dest || dest.trim() === '') return null;
      if (origin && origin.trim() !== '') {
        return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin.trim())}&destination=${encodeURIComponent(dest.trim())}`;
      }
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest.trim())}`;
    };

    const getSafetyBadge = (lvl) => {
      if (lvl === 'G' || lvl === 'green') return '<span class="text-xs font-extrabold bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-lg">🟢 치안양호</span>';
      if (lvl === 'Y' || lvl === 'yellow') return '<span class="text-xs font-extrabold bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-lg">🟡 주의필요</span>';
      if (lvl === 'R' || lvl === 'red') return '<span class="text-xs font-extrabold bg-rose-100 text-rose-800 border border-rose-300 px-2.5 py-0.5 rounded-lg">🔴 위험주의</span>';
      return '';
    };

    // Global Outdoor & Menswear Shopping Bible Data

      { brand: "Calvin Klein (캘빈클라인)", krPrice: "언더웨어 3팩 9~12만원 / 패딩·맨투맨 25만원", usPrice: "언더웨어 3팩 $16~$22 / 아우터·맨투맨 $25~$45", target: "남성 모달/코튼 드로즈 3팩, 경량 패딩, 로고 후드티", bestSpots: "① 포틀랜드 Cascades Station (Ross/TJ Maxx가 아울렛보다 더 쌈!) ② 시카고/뉴저지 CK Factory Store" },

      { brand: "The North Face (노스페이스)", krPrice: "눕시/고어텍스 재킷 38~55만원", usPrice: "아우터 $90~$160 / 플리스·후드 $35~$55", target: "미국판 눕시/마운틴 재킷, 데날리(Denali) 플리스, 빅샷 백팩", bestSpots: "① 시카고 Fashion Outlets (노스페이스 공식 아울렛) ② 뉴저지 Jersey Gardens (세금 0% 노스페이스 아울렛)" },

    // =========================================================================

    let routesData = [];

    // =========================================================================
    // DATA PERSISTENCE & SHARE
    // =========================================================================
    function loadUserData() {
      try {
        if (window.location.hash && window.location.hash.startsWith('#data=')) {
          const encoded = window.location.hash.replace('#data=', '');
          const decoded = decodeURIComponent(escape(atob(encoded)));
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed) && parsed.length > 0) { routesData = parsed; return; }
        }
      } catch (e) {}
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) { routesData = parsed; return; }
        }
      } catch (e) {}
      routesData = JSON.parse(JSON.stringify(defaultRoutesData));
    }

    function saveUserDataLocally() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(routesData)); } catch (e) {}
    }

    function shareLink() {
      saveUserDataLocally();
      try {
        const jsonStr = JSON.stringify(routesData);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert('✅ 수정된 일정이 담긴 [공유 링크]가 복사되었습니다!\n\n친구에게 카톡으로 보내면 내가 변경한 일정과 지도가 똑같이 열립니다.');
          }).catch(() => prompt('아래 링크를 복사하세요:', shareUrl));
        } else {
          prompt('아래 링크를 복사하세요:', shareUrl);
        }
      } catch (e) { alert('공유 링크 생성 실패'); }
    }

    function resetToDefault() {
      if (confirm('수정한 일정을 모두 초기화하고 원본 일정으로 되돌리시겠습니까?')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
        window.location.hash = '';
        routesData = JSON.parse(JSON.stringify(defaultRoutesData));
        renderTabs();
        renderContent();
      }
    }

    function calcDayCost(items) {
      let total = 0;
      (items || []).forEach(it => {
        if (it.done) return;
        const m = (it.cost || '').match(/\$\s*(\d+(\.\d+)?)/);
        if (m) total += parseFloat(m[1]);
      });
      return Math.round(total);
    }

      window.scrollTo({ top: 0, behavior: 'smooth' });

        if (v === view) {

      renderContent();

            <div class="space-y-5">
              ${tierConfig.map(tc => {
                const list = (r.tiers && r.tiers[tc.key]) ? r.tiers[tc.key] : [];
                return `
                  <div class="rounded-2xl border-2 ${tc.border} overflow-hidden bg-white">
                    <div class="${tc.headerBg} px-4 py-3 flex items-center justify-between">
                      <span class="text-sm sm:text-base font-black">${tc.label}</span>
                      <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-black/20">${list.length}곳</span>

                    <div class="p-4 grid grid-cols-1 gap-3">
                      ${list.map((alt, altIdx) => `
                        <div class="border border-slate-200 rounded-2xl p-4 hover:border-indigo-300 transition bg-slate-50/60 space-y-2.5">
                          <div class="flex flex-wrap items-center justify-between gap-2">
                            <h4 class="text-base font-black text-slate-900">${alt.name}</h4>

                              <span class="text-xs font-extrabold bg-emerald-100 text-emerald-900 px-2.5 py-1 rounded-lg border border-emerald-200">💰 ${alt.cost}</span>

                          ${alt.safetyNote ? `<p class="text-xs text-amber-800 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl font-semibold">💡 ${alt.safetyNote}</p>` : ''}
                          <div class="flex items-center gap-2 pt-2">
                            <button onclick="openSwapModalFromCatalog('${tc.key}', ${altIdx})" class="flex-1 ${tc.btn} text-xs sm:text-sm font-black py-2.5 px-4 rounded-xl shadow-xs transition flex items-center justify-center gap-1.5">
                              <i class="fa-solid fa-calendar-plus"></i> 이 장소를 내 일정에 넣기 / 교체
                            </button>
                            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(alt.dest || alt.name)}" target="_blank" class="bg-white hover:bg-slate-100 text-slate-800 border border-slate-300 text-xs sm:text-sm font-extrabold py-2.5 px-4 rounded-xl transition flex items-center gap-1.5">
                              <i class="fa-solid fa-map-pin text-indigo-600"></i> 지도
                            </a>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
        return;
      }

      // VIEW 3: OUTDOOR & CLASSIC MENSWEAR SHOPPING BIBLE
      if (currentMainView === 'shopping') {
        container.innerHTML = `
          <div class="card-elevated rounded-3xl overflow-hidden bg-white">
            <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-5 sm:p-6">
              <span class="text-xs font-black bg-amber-400 text-slate-950 px-2.5 py-1 rounded-md">한국 대비 50~70% 할인</span>
              <h2 class="text-xl sm:text-2xl font-black mt-2">🧥 미국 아웃도어 & 폴로·리바이스·CK 쇼핑 바이블</h2>
              <p class="text-xs sm:text-sm text-slate-300 mt-1 font-medium">한국에서는 비싸지만 미국 아울렛·노택스 주에서는 거저 수준인 핵심 타겟 브랜드 리스트입니다.</p>
            </div>

            <div class="p-5 space-y-4">
              <!-- Top 3 Golden Cities Summary -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="bg-emerald-50 border-2 border-emerald-200 p-4 rounded-2xl">
                  <div class="text-xs font-black text-emerald-700">1차 성지 • 12/19~20</div>
                  <div class="text-base font-black text-slate-900 mt-0.5">포틀랜드 (세금 0%)</div>
                  <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">컬럼비아 본사 도시! <strong>Cascades Station(Ross·Rack·TJ Maxx)</strong> 및 <strong>NW 23번가(파타고니아·아크테릭스)</strong>에서 소비세 0%로 구매.</p>
                </div>
                <div class="bg-indigo-50 border-2 border-indigo-200 p-4 rounded-2xl">
                  <div class="text-xs font-black text-indigo-700">2차 성지 • 12/24 오전</div>
                  <div class="text-base font-black text-slate-900 mt-0.5">시카고 로즈몬트 아울렛</div>
                  <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">블루라인 35분! <strong>폴로·리바이스·CK·노스페이스·컬럼비아</strong> + 희귀한 <strong>아크테릭스 공식 아울렛</strong>까지 한 건물에 입점!</p>
                </div>
                <div class="bg-amber-50 border-2 border-amber-200 p-4 rounded-2xl">
                  <div class="text-xs font-black text-amber-800">3차 성지 • 12/31 오전</div>
                  <div class="text-base font-black text-slate-900 mt-0.5">뉴저지 저지 가든스 (세금 0%)</div>
                  <p class="text-xs text-slate-700 mt-1.5 leading-relaxed">맨해튼에서 버스 35분! 뉴저지 <strong>의류·신발 세금 0%</strong> 혜택으로 대형 <strong>폴로·노스페이스·리바이스·CK</strong> 최종 싹쓸이.</p>
                </div>
              </div>

              <!-- Brand by Brand Target Cards -->
              <div class="space-y-3 pt-2">
                <h3 class="text-base font-black text-slate-900"><i class="fa-solid fa-tags text-indigo-600 mr-1.5"></i>브랜드별 미국 현지 체감가 & 필수 타겟 아이템</h3>
                ${shoppingBibleData.map(b => `
                  <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50/70 space-y-2">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <h4 class="text-base font-black text-indigo-950">${b.brand}</h4>
                      <div class="flex items-center gap-2 text-xs font-extrabold">
                        <span class="line-through text-slate-400">한국 ${b.krPrice}</span>
                        <span class="bg-rose-600 text-white px-2.5 py-1 rounded-lg">미국 ${b.usPrice}</span>
                      </div>
                    </div>
                    <div class="text-xs sm:text-sm text-slate-800 font-semibold">🎯 <strong>집중 타겟:</strong> ${b.target}</div>
                    <div class="text-xs text-indigo-800 bg-indigo-50 border border-indigo-100 px-3 py-2 rounded-xl font-medium">📍 <strong>추천 매장:</strong> ${b.bestSpots}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      // VIEW 4: TRANSIT & SAFETY GUIDE
      if (currentMainView === 'transit') {
        container.innerHTML = `
          ${topBannerHtml}

          <div class="card-elevated rounded-3xl p-5 bg-white space-y-4">
            <h3 class="text-lg font-black text-slate-900"><i class="fa-solid fa-shield-halved text-rose-600 mr-1.5"></i>${r.title} 시간·장소별 치안 수칙</h3>
            <div class="bg-rose-50 border-2 border-rose-200 p-4 rounded-2xl text-sm font-bold text-rose-950 leading-relaxed">
              ${r.safetyOverview}
            </div>

            <h3 class="text-lg font-black text-slate-900 pt-2"><i class="fa-solid fa-ticket text-emerald-600 mr-1.5"></i>${r.title} 대중교통 패스 & 기종별(iOS/Android) 탑승법</h3>
            <div class="space-y-3">
              ${(r.transGuide || []).map(t => `
                <div class="border border-slate-200 rounded-2xl p-4 bg-slate-50 space-y-2.5">
                  <div class="flex items-center justify-between gap-2">
                    <h4 class="text-base font-black text-slate-900">${t.title}</h4>
                    ${t.cost ? `<span class="text-xs font-black bg-emerald-600 text-white px-3 py-1 rounded-lg">${t.cost}</span>` : ''}
                  </div>
                  <p class="text-xs sm:text-sm text-slate-700 font-medium leading-relaxed">${t.desc}</p>
                  ${(t.apple || t.android) ? `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2 border-t border-slate-200 text-xs">
                      ${t.apple ? `
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                          <div class="font-black text-slate-900 mb-1"><i class="fa-brands fa-apple mr-1"></i>애플 유저 (아이폰/워치)</div>
                          <div class="text-slate-600 font-medium">${t.apple}</div>
                        </div>
                      ` : ''}
                      ${t.android ? `
                        <div class="bg-white p-3 rounded-xl border border-slate-200">
                          <div class="font-black text-emerald-700 mb-1"><i class="fa-brands fa-android mr-1"></i>안드로이드 유저 (친구)</div>
                          <div class="text-slate-600 font-medium">${t.android}</div>
                        </div>
                      ` : ''}
                    </div>
                  ` : ''}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    }

    // =========================================================================
    // INTERACTIVE MODAL HANDLERS (1-CLICK SWAP / INSERT / EDIT)
    // =========================================================================
    function moveItem(schIdx, itemIdx, dir) {
      const items = routesData[currentRouteIndex].schedules[schIdx].items;
      const targetIdx = itemIdx + dir;
      if (targetIdx < 0 || targetIdx >= items.length) return;
      const temp = items[itemIdx];
      items[itemIdx] = items[targetIdx];
      items[targetIdx] = temp;
      saveUserDataLocally();
      renderContent();
    }

    // Open Swap Modal directly from a specific Schedule Card
    function openSwapModalForSlot(schIdx, itemIdx) {
      const r = routesData[currentRouteIndex];
      const targetItem = r.schedules[schIdx].items[itemIdx];
      document.getElementById('swapModalTitle').textContent = `🔄 [${targetItem.time}] 대안 장소로 교체`;
      document.getElementById('swapModalSubtitle').textContent = `현재 일정: ${targetItem.title}`;
      document.getElementById('swapTargetSelectorBox').classList.add('hidden');

      renderSwapModalList(schIdx, itemIdx);
      document.getElementById('swapModal').classList.remove('hidden');
    }

    // Open Swap Modal from Alternatives Tab
    function openSwapModalFromCatalog(tierKey, altIdx) {
      const r = routesData[currentRouteIndex];
      const alt = r.tiers[tierKey][altIdx];
      document.getElementById('swapModalTitle').textContent = `📅 [${alt.name}] 일정에 넣기`;
      document.getElementById('swapModalSubtitle').textContent = `넣고 싶은 날짜와 방식(새로 추가 또는 기존 일정 교체)을 선택하세요.`;
      
      const box = document.getElementById('swapTargetSelectorBox');
      box.classList.remove('hidden');

      const daySel = document.getElementById('swapDaySelect');
      daySel.innerHTML = r.schedules.map((s, idx) => `<option value="${idx}">${s.day}</option>`).join('');
      populateSwapTargetItems();

      const listContainer = document.getElementById('swapModalList');
      listContainer.innerHTML = `
        <div class="bg-indigo-50 border-2 border-indigo-200 p-4 rounded-2xl space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-base font-black text-indigo-950">${alt.name}</span>
            <span class="text-xs font-black bg-indigo-600 text-white px-2.5 py-1 rounded-lg">${alt.cost}</span>
          </div>
          <p class="text-xs sm:text-sm text-slate-700 font-medium">${alt.desc}</p>
          <button onclick="executeCatalogInsert('${tierKey}', ${altIdx})" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-xl text-sm shadow-md mt-2">
            ✅ 선택한 일정표 위치에 즉시 반영하기
          </button>
        </div>
      `;
      document.getElementById('swapModal').classList.remove('hidden');
    }

    function populateSwapTargetItems() {
      const r = routesData[currentRouteIndex];
      const dayIdx = parseInt(document.getElementById('swapDaySelect').value) || 0;
      const items = r.schedules[dayIdx].items || [];
      const itemSel = document.getElementById('swapItemSelect');
      itemSel.innerHTML = `
        <option value="-1">➕ 이 날짜 맨 마지막에 새 일정으로 추가</option>
        ${items.map((it, idx) => `<option value="${idx}">🔄 [${it.time}] ${it.title} 대신 교체</option>`).join('')}
      `;
    }

    function executeCatalogInsert(tierKey, altIdx) {
      const dayIdx = parseInt(document.getElementById('swapDaySelect').value) || 0;
      const itemIdx = parseInt(document.getElementById('swapItemSelect').value);
      applyAlternativeToSchedule(dayIdx, itemIdx, tierKey, altIdx);
      closeSwapModal();
      setMainView('schedule');
    }

    function renderSwapModalList(targetSchIdx, targetItemIdx) {
      const r = routesData[currentRouteIndex];
      const groups = [
        { key: 'shopping', name: '🧥 폴로·리바이스·CK·아웃도어 쇼핑', badge: 'bg-amber-100 text-amber-900' },
        { key: 'standard', name: '🍖 필수 클래식 & 무제한(AYCE) 맛집', badge: 'bg-blue-100 text-blue-900' },
        { key: 'budget', name: '🟢 가성비 & 무료 명소', badge: 'bg-emerald-100 text-emerald-900' },
        { key: 'premium', name: '🥩 프리미엄 스테이크 & 명소', badge: 'bg-purple-100 text-purple-900' }
      ];

      const listContainer = document.getElementById('swapModalList');
      listContainer.innerHTML = groups.map(g => {
        const list = (r.tiers && r.tiers[g.key]) ? r.tiers[g.key] : [];
        return `
          <div class="space-y-2">
            <div class="text-xs font-black px-2.5 py-1 rounded-lg inline-block ${g.badge}">${g.name}</div>
            ${list.map((alt, altIdx) => `
              <div class="border border-slate-200 hover:border-indigo-400 rounded-2xl p-3.5 bg-slate-50 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 transition">
                <div class="space-y-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-black text-slate-900">${alt.name}</span>
                    <span class="text-xs font-extrabold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">${alt.cost}</span>
                    <span class="text-xs font-bold text-indigo-600">${alt.duration}</span>
                  </div>
                  <p class="text-xs text-slate-600">${alt.desc}</p>
                </div>
                <button onclick="applyAlternativeToSchedule(${targetSchIdx}, ${targetItemIdx}, '${g.key}', ${altIdx}); closeSwapModal();" 
                  class="shrink-0 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-black px-4 py-2.5 rounded-xl shadow-xs transition">
                  이 장소로 교체
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function applyAlternativeToSchedule(schIdx, itemIdx, tierKey, altIdx) {
      const r = routesData[currentRouteIndex];
      const alt = r.tiers[tierKey][altIdx];
      if (!alt) return;
      const prefix = tierKey === 'shopping' ? '🧥 [쇼핑]' : tierKey === 'premium' ? '🥩 [프리미엄]' : '✨ [추천]';

      if (itemIdx === -1) {
        r.schedules[schIdx].items.push(
          I("자유 시간", `${prefix} ${alt.name}`, "", alt.dest || alt.name, alt.cost, alt.duration, alt.safetyLevel || "G", alt.safetyNote || alt.desc, !!alt.needsRide)
        );
      } else {
        const prev = r.schedules[schIdx].items[itemIdx];
        r.schedules[schIdx].items[itemIdx] = I(
          prev.time,
          `${prefix} ${alt.name}`,
          prev.origin || "",
          alt.dest || alt.name,
          alt.cost || prev.cost,
          alt.duration || prev.duration,
          alt.safetyLevel || "G",
          alt.safetyNote || alt.desc,
          !!alt.needsRide
        );
      }
      saveUserDataLocally();
      renderContent();
    }

    function closeSwapModal() {
      document.getElementById('swapModal').classList.add('hidden');
    }

    // --- Direct Edit Modal ---
    function openEditModal(schIdx, itemIdx) {
      const item = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      document.getElementById('editSchIdx').value = schIdx;
      document.getElementById('editItemIdx').value = itemIdx;
      document.getElementById('editTime').value = item.time || '';
      document.getElementById('editSafetyLevel').value = (item.safetyLevel === 'yellow' || item.safetyLevel === 'Y') ? 'Y' : (item.safetyLevel === 'red' || item.safetyLevel === 'R') ? 'R' : 'G';
      document.getElementById('editItemTitle').value = item.title || '';
      document.getElementById('editCost').value = item.cost || '';
      document.getElementById('editDuration').value = item.duration || '';
      document.getElementById('editSafety').value = item.safetyNote || '';
      document.getElementById('editNeedsRide').checked = !!item.needsRide;
      document.getElementById('editOrigin').value = item.origin || '';
      document.getElementById('editDest').value = item.dest || item.title || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveModalChanges() {
      const schIdx = parseInt(document.getElementById('editSchIdx').value);
      const itemIdx = parseInt(document.getElementById('editItemIdx').value);
      const target = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      
      target.time = document.getElementById('editTime').value;
      target.safetyLevel = document.getElementById('editSafetyLevel').value;
      target.title = document.getElementById('editItemTitle').value;
      target.cost = document.getElementById('editCost').value;
      target.duration = document.getElementById('editDuration').value;
      target.safetyNote = document.getElementById('editSafety').value;
      target.needsRide = document.getElementById('editNeedsRide').checked;
      target.origin = document.getElementById('editOrigin').value;
      target.dest = document.getElementById('editDest').value;

      saveUserDataLocally();
      closeEditModal();
      renderContent();
    }

    function deleteItem(schIdx, itemIdx) {
      if (confirm('이 일정을 삭제하시겠습니까?')) {
        routesData[currentRouteIndex].schedules[schIdx].items.splice(itemIdx, 1);
        saveUserDataLocally();
        renderContent();
      }
    }

    function toggleDone(schIdx, itemIdx) {
      const target = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      target.done = !target.done;
      saveUserDataLocally();
      renderContent();
    }

    function addItemPrompt(schIdx) {
      const title = prompt('추가할 장소명 또는 일정을 입력하세요:');
      if (!title) return;
      const time = prompt('시간대를 입력하세요 (예: 18:00 - 19:30):', '18:00 - 19:30');
      const cost = prompt('예상 비용을 입력하세요 (예: 식비 $25):', '$20');
      routesData[currentRouteIndex].schedules[schIdx].items.push(
        I(time || '자유시간', title, '', title, cost || '$0', '약 1시간', 'G', '구글 지도 위치 자동 연동됨', false)
      );
      saveUserDataLocally();
      renderContent();
    }

    window.onload = function() {
      loadUserData();
      renderTabs();
      renderContent();
    };
  </script>
