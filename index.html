              isActive 
                ? 'nav-tab-active bg-white border-indigo-600' 
                : 'bg-slate-50 border-slate-200 text-slate-500'
            }">
            <div class="w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black ${
              isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-400'
            }">${route.num}</div>
            <div>
              <div class="text-[11px] font-extrabold leading-tight ${isActive ? 'text-slate-900' : 'text-slate-600'}">${route.title}</div>
              <div class="text-[9px] ${isActive ? 'text-indigo-600 font-bold' : 'text-slate-400'}">${route.dateRange}</div>
