    let routesData = [];
    let currentRouteIndex = 0;

    function loadUserData() {
      try {
        if (window.location.hash && window.location.hash.startsWith('#data=')) {
          const encoded = window.location.hash.replace('#data=', '');
          const decoded = decodeURIComponent(escape(atob(encoded)));
          routesData = JSON.parse(decoded);
          if (Array.isArray(routesData) && routesData.length > 0) return;
        }
      } catch (e) {
        console.warn("Hash decode error:", e);
      }

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          routesData = JSON.parse(saved);
          if (Array.isArray(routesData) && routesData.length > 0) return;
        }
      } catch (e) {
        console.warn("LocalStorage error:", e);
      }

      routesData = JSON.parse(JSON.stringify(defaultRoutesData));
    }

    function saveUserDataLocally() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(routesData));
      } catch (e) {
        console.warn("Save local failed:", e);
      }
    }

    function shareLink() {
      saveUserDataLocally();
      try {
        const jsonStr = JSON.stringify(routesData);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert('수정된 전체 일정이 담긴 [공유용 링크]가 클립보드에 복사되었습니다!\n\n동행인에게 이 링크를 보내면 누구나 똑같이 볼 수 있습니다.');
          }).catch(() => {
            prompt('아래 공유 링크를 복사하여 전달하세요:', shareUrl);
          });
        } else {
          prompt('아래 공유 링크를 복사하여 전달하세요:', shareUrl);
        }
      } catch (e) {
        alert('공유 링크 생성 중 오류가 발생했습니다.');
      }
    }

    function resetToDefault() {
      if (confirm('모든 수정 사항을 초기화하고 원본 일정으로 돌아가시겠습니까?')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
        window.location.hash = '';
        routesData = JSON.parse(JSON.stringify(defaultRoutesData));
        renderTabs();
        renderContent();
      }
    }

    function renderTabs() {
      const container = document.getElementById('routeTabs');
      if (!container) return;
      container.innerHTML = routesData.map((route, idx) => {
        const isActive = idx === currentRouteIndex;
        return `
          <button onclick="selectRoute(${idx})" 
            class="flex items-center gap-1.5 px-3 py-2 rounded-2xl text-left border shrink-0 transition-all ${
              isActive 
                ? 'nav-tab-active bg-white border-indigo-600' 
                : 'bg-slate-50 border-slate-200 text-slate-500'
            }">
            <div class="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black ${
              isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-500'
            }">${route.num}</div>
            <div>
              <div class="text-[11px] font-extrabold leading-tight ${isActive ? 'text-indigo-900' : 'text-slate-700'}">${route.title}</div>
              <div class="text-[9px] ${isActive ? 'text-indigo-600 font-bold' : 'text-slate-400'}">${route.dateRange}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderContent() {
      const r = routesData[currentRouteIndex];
      const container = document.getElementById('mainContent');
      if (!container || !r) return;

      container.innerHTML = `
        <!-- Hotel & Safety Overview Card -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-extrabold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg border border-indigo-100">
              <i class="fa-solid fa-hotel"></i> ${r.num}구간 확정 숙소
            </span>
            <span class="text-[10px] font-bold text-slate-400">${r.dateRange}</span>
          </div>
          <h2 class="text-base font-black text-slate-900 leading-snug">${r.hotel}</h2>
          
          ${r.safetyOverview ? `
            <div class="bg-rose-50/80 border border-rose-100 p-2.5 rounded-2xl flex items-start gap-2 mt-1">
              <i class="fa-solid fa-triangle-exclamation text-rose-500 text-xs mt-0.5 shrink-0"></i>
              <div class="text-[10px] text-rose-900 leading-tight font-medium">
                <strong>도시 핵심 치안:</strong> ${r.safetyOverview}
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Transit Guide Card -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-2">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg bg-emerald-100 text-emerald-700 flex items-center justify-center text-xs font-bold">
              <i class="fa-solid fa-bus"></i>
            </div>
            <h3 class="text-xs font-black text-slate-900">교통 패스 & 대중교통 팁</h3>
          </div>
          <div class="space-y-1.5">
            ${(r.transGuide || []).map(t => `
              <div class="bg-slate-50 p-2.5 rounded-2xl border border-slate-100 flex justify-between items-start">
                <div class="pr-2">
                  <div class="text-[11px] font-bold text-slate-800">${t.title}</div>
                  <div class="text-[10px] text-slate-500 mt-0.5 leading-tight">${t.desc}</div>
                </div>
                ${t.cost ? `<span class="text-[9px] font-black bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-md shrink-0 whitespace-nowrap">${t.cost}</span>` : ''}
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Timed Itinerary Schedule Card -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <div class="w-6 h-6 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold">
                <i class="fa-regular fa-clock"></i>
              </div>
              <div>
                <h3 class="text-xs font-black text-slate-900">일자별 디테일 일정표</h3>
                <p class="text-[9px] text-slate-400 font-medium">이동시간·비용·우버연동 탑재</p>
              </div>
            </div>
            <button onclick="shareLink()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold px-2.5 py-1.5 rounded-xl shadow">
              <i class="fa-solid fa-floppy-disk"></i> 공유 저장
            </button>
          </div>

          ${(r.schedules || []).map((sch, schIdx) => `
            <div class="mb-5 border-b border-slate-100 pb-4 last:border-0 last:pb-0">
              <div class="flex justify-between items-center bg-slate-900 text-white px-3 py-1.5 rounded-xl text-[11px] font-black mb-1">
                <span>${sch.day}</span>
                <button onclick="addItemPrompt(${schIdx})" class="text-[9px] bg-indigo-600 hover:bg-indigo-500 px-2 py-0.5 rounded-lg text-white font-bold">
                  + 일정 추가
                </button>
              </div>
              <p class="text-[10px] text-indigo-600 font-bold mb-3 px-1">💡 요약: ${sch.summary}</p>
              
              <div class="relative pl-3.5 border-l-2 border-indigo-200 space-y-3 ml-1">
                ${(sch.items || []).map((item, itemIdx) => {
                  const mapUrl = makeMapUrl(item.origin, item.dest);
                  const uberUrl = makeUberUrl(item.dest || item.title);
                  const lyftUrl = makeLyftUrl(item.dest || item.title);

                  return `
                    <div class="relative ${item.done ? 'opacity-40 line-through' : ''}">
                      <div class="absolute w-2.5 h-2.5 bg-indigo-600 rounded-full -left-[19px] top-1 border-2 border-white"></div>
                      
                      <div class="flex justify-between items-center mb-0.5">
                        <div class="flex items-center gap-1.5">
                          <span class="text-[10px] font-black text-indigo-600">${item.time}</span>
                          ${getSafetyBadge(item.safetyLevel)}
                        </div>
                        <div class="flex items-center gap-1">
                          <button onclick="toggleDone(${schIdx}, ${itemIdx})" class="text-[10px] text-slate-400 hover:text-emerald-600 px-1">
                            <i class="fa-solid ${item.done ? 'fa-circle-check text-emerald-600' : 'fa-circle'}"></i>
                          </button>
                          <button onclick="openModal(${schIdx}, ${itemIdx})" class="text-[10px] text-slate-400 hover:text-indigo-600 px-1">
                            <i class="fa-solid fa-pen-to-square"></i>
                          </button>
                          <button onclick="deleteItem(${schIdx}, ${itemIdx})" class="text-[10px] text-slate-400 hover:text-rose-600 px-1">
                            <i class="fa-solid fa-trash-can"></i>
                          </button>
                        </div>
                      </div>

                      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-1.5">
                        <div class="flex justify-between items-start">
                          <h4 class="font-bold text-[11px] text-slate-900 leading-tight pr-2">${item.title}</h4>
                        </div>

                        <!-- Movement Duration & Cost Badges -->
                        <div class="flex flex-wrap items-center gap-1.5 text-[9px]">
                          <span class="bg-indigo-50 text-indigo-700 font-extrabold px-2 py-0.5 rounded-md border border-indigo-100">
                            ⏱️ ${item.duration || '약 1시간'}
                          </span>
                          <span class="bg-emerald-50 text-emerald-800 font-extrabold px-2 py-0.5 rounded-md border border-emerald-100">
                            💰 ${item.cost || '자유'}
                          </span>
                        </div>

                        ${item.safetyNote ? `
                          <div class="text-[9px] text-slate-600 bg-amber-50/70 border border-amber-100 p-1.5 rounded-xl leading-tight flex items-start gap-1">
                            <i class="fa-solid fa-shield text-amber-500 text-[9px] mt-0.5"></i>
                            <span><strong>치안 팁:</strong> ${item.safetyNote}</span>
                          </div>
                        ` : ''}

                        <!-- Action Buttons -->
                        <div class="grid grid-cols border-t border-slate-200 pt-1.5 mt-1 gap-1">
                          ${mapUrl ? `
                            <a href="${mapUrl}" target="_blank" 
                               class="bg-white hover:bg-indigo-50 text-indigo-600 text-[9px] font-bold py-1 px-2 rounded-lg border border-slate-200 flex items-center justify-center gap-1 transition">
                               <i class="fa-solid fa-map-location-dot"></i> 구글 지도 보기
                            </a>
                          ` : ''}

                          ${item.needsRide ? `
                            <div class="grid grid-cols-2 gap-1 mt-0.5">
                              <a href="${uberUrl}" target="_blank" 
                                 class="bg-black hover:bg-slate-800 text-white text-[9px] font-black py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition shadow-sm">
                                 <i class="fa-solid fa-car text-amber-400"></i> Uber 호출
                              </a>
                              <a href="${lyftUrl}" target="_blank" 
                                 class="bg-pink-600 hover:bg-pink-700 text-white text-[9px] font-black py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition shadow-sm">
                                 <i class="fa-solid fa-taxi"></i> Lyft 호출
                              </a>
                            </div>
                          ` : ''}
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}

          <button onclick="shareLink()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-2xl text-xs shadow-md mt-2 flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-share-nodes"></i> 수정 사항 반영 & 공유 링크 복사
          </button>
        </div>

        <!-- 4-Tier Option Categories -->
        <div class="bg-white rounded-3xl p-4 border border-slate-200 shadow-sm space-y-3">
          <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded-lg bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold">
              <i class="fa-solid fa-layer-group"></i>
            </div>
            <div>
              <h3 class="text-xs font-black text-slate-900">4단계 추천 선택 라인업</h3>
              <p class="text-[9px] text-slate-400 font-medium">가성비 / 클래식 / 프리미엄 / 초특가 쇼핑</p>
            </div>
          </div>

          <!-- Tier 1: Budget -->
          <div class="border border-emerald-200 bg-emerald-50/40 rounded-2xl p-3">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <h4 class="text-[11px] font-black text-emerald-900">1. 가성비 & 무료 라인업 (Budget / Free)</h4>
            </div>
            <div class="space-y-1.5">
              ${(r.tiers.budget || []).map(item => `
                <div class="bg-white p-2 rounded-xl border border-emerald-100 flex justify-between items-center">
                  <div class="pr-2">
                    <div class="text-[10px] font-bold text-slate-800">${item.name}</div>
                    <div class="text-[9px] text-slate-500">${item.desc}</div>
                  </div>
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.dest)}" target="_blank" 
                     class="w-6 h-6 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 text-[10px]">
                    <i class="fa-solid fa-map-pin"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Tier 2: Standard -->
          <div class="border border-blue-200 bg-blue-50/40 rounded-2xl p-3">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              <h4 class="text-[11px] font-black text-blue-900">2. 필수 & 클래식 라인업 (Standard / Must)</h4>
            </div>
            <div class="space-y-1.5">
              ${(r.tiers.standard || []).map(item => `
                <div class="bg-white p-2 rounded-xl border border-blue-100 flex justify-between items-center">
                  <div class="pr-2">
                    <div class="text-[10px] font-bold text-slate-800">${item.name}</div>
                    <div class="text-[9px] text-slate-500">${item.desc}</div>
                  </div>
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.dest)}" target="_blank" 
                     class="w-6 h-6 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center shrink-0 text-[10px]">
                    <i class="fa-solid fa-map-pin"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Tier 3: Premium -->
          <div class="border border-purple-200 bg-purple-50/40 rounded-2xl p-3">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="w-2 h-2 rounded-full bg-purple-500"></span>
              <h4 class="text-[11px] font-black text-purple-900">3. 돈 더 내도 꼭 가볼 라인업 (Premium Splurge)</h4>
            </div>
            <div class="space-y-1.5">
              ${(r.tiers.premium || []).map(item => `
                <div class="bg-white p-2 rounded-xl border border-purple-100 flex justify-between items-center">
                  <div class="pr-2">
                    <div class="text-[10px] font-bold text-slate-800">${item.name}</div>
                    <div class="text-[9px] text-slate-500">${item.desc}</div>
                  </div>
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.dest)}" target="_blank" 
                     class="w-6 h-6 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center shrink-0 text-[10px]">
                    <i class="fa-solid fa-map-pin"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Tier 4: Shopping -->
          <div class="border border-amber-200 bg-amber-50/40 rounded-2xl p-3">
            <div class="flex items-center gap-1.5 mb-2">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <h4 class="text-[11px] font-black text-amber-900">4. 핵심 폴로/브랜드 초특가 아울렛 (Shopping)</h4>
            </div>
            <div class="space-y-1.5">
              ${(r.tiers.shopping || []).map(item => `
                <div class="bg-white p-2 rounded-xl border border-amber-100 flex justify-between items-center">
                  <div class="pr-2">
                    <div class="text-[10px] font-bold text-slate-800">${item.name}</div>
                    <div class="text-[9px] text-slate-500">${item.desc}</div>
                  </div>
                  <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.dest)}" target="_blank" 
                     class="w-6 h-6 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center shrink-0 text-[10px]">
                    <i class="fa-solid fa-map-pin"></i>
                  </a>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    function openModal(schIdx, itemIdx) {
      const item = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      document.getElementById('editSchIdx').value = schIdx;
      document.getElementById('editItemIdx').value = itemIdx;
      document.getElementById('editTime').value = item.time || '';
      document.getElementById('editItemTitle').value = item.title || '';
      document.getElementById('editCost').value = item.cost || '';
      document.getElementById('editDuration').value = item.duration || '';
      document.getElementById('editSafety').value = item.safetyNote || '';
      document.getElementById('editNeedsRide').checked = !!item.needsRide;
      document.getElementById('editOrigin').value = item.origin || '';
      document.getElementById('editDest').value = item.dest || item.title || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveModalChanges() {
      const schIdx = parseInt(document.getElementById('editSchIdx').value);
      const itemIdx = parseInt(document.getElementById('editItemIdx').value);
      
      const targetItem = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      targetItem.time = document.getElementById('editTime').value;
      targetItem.title = document.getElementById('editItemTitle').value;
      targetItem.cost = document.getElementById('editCost').value;
      targetItem.duration = document.getElementById('editDuration').value;
      targetItem.safetyNote = document.getElementById('editSafety').value;
      targetItem.needsRide = document.getElementById('editNeedsRide').checked;
      targetItem.origin = document.getElementById('editOrigin').value;
      targetItem.dest = document.getElementById('editDest').value;

      saveUserDataLocally();
      closeModal();
      renderContent();
    }

    function deleteItem(schIdx, itemIdx) {
      if (confirm('이 항목을 삭제하시겠습니까?')) {
        routesData[currentRouteIndex].schedules[schIdx].items.splice(itemIdx, 1);
        saveUserDataLocally();
        renderContent();
      }
    }

    function toggleDone(schIdx, itemIdx) {
      const targetItem = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      targetItem.done = !targetItem.done;
      saveUserDataLocally();
      renderContent();
    }

    function addItemPrompt(schIdx) {
      const title = prompt('추가할 일정/장소명을 입력하세요:');
      if (!title) return;
      const time = prompt('시간대를 입력하세요 (예: 18:00 - 19:30):', '18:00 - 19:00');
      const cost = prompt('비용을 입력하세요 (예: 식비 $20):', '$20');
      const duration = prompt('이동/소요 시간을 입력하세요 (예: 도보 10분 / 우버 15분):', '약 1시간');

      routesData[currentRouteIndex].schedules[schIdx].items.push({
        time: time || '자유시간',
        title: title,
        cost: cost || '자유',
        duration: duration || '약 1시간',
        safetyLevel: 'green',
        safetyNote: '소지품 유의',
        needsRide: false,
        origin: '',
        dest: title,
        done: false
      });

      saveUserDataLocally();
      renderContent();
    }

    function selectRoute(index) {
      currentRouteIndex = index;
      renderTabs();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
      try {
        loadUserData();
        renderTabs();
        renderContent();
      } catch (err) {
        console.error("Init Error:", err);
      }
    };
  </script>
</body>
</html>
