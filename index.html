          { name: "할랄 가이즈", type: "식당", desc: "뉴욕 스트리트 푸드 근본 치킨오버라이스 ($12)", dest: "The Halal Guys 53rd and 6th" },
          { name: "타임스 스퀘어 야경", type: "명소", desc: "세계의 교차로 인증샷 (무료)", dest: "Times Square NYC" }

      {

        num: 7,
        title: "워싱턴 D.C. ➔ 귀국",
        tag: "Route 7",
        costs: { food: 155, attr: 0, trans: 30, totalPer: 185 },
        schedules: [
          {
            day: "1/2(금) 스미스소니언",
            items: [
              { time: "14:25", title: "유니언역 ➔ 호텔 짐보관", origin: "Washington Union Station", dest: "Kellogg Conference Hotel Capitol Hill", cost: "우버 분담 $8" },
              { time: "16:00", title: "항공우주/자연사 박물관 투어", origin: "Kellogg Conference Hotel Capitol Hill", dest: "National Air and Space Museum", cost: "명소 무료" },
              { time: "18:30", title: "조스 시푸드 스톤크랩 만찬", origin: "National Air and Space Museum", dest: "Joe's Seafood Prime Steak Washington DC", cost: "식비 $100" }
            ]
          },
          {
            day: "1/3~1/4 워싱턴 명소",
            items: [
              { time: "11:00", title: "미 국회도서관 내부 투어", origin: "Kellogg Conference Hotel Capitol Hill", dest: "Library of Congress", cost: "명소 무료" },
              { time: "13:30", title: "유니언 마켓 트렌디 런치", origin: "Library of Congress", dest: "Union Market DC", cost: "식비 $25" },
              { time: "16:30", title: "링컨 기념관 & 워싱턴 탑 야경", origin: "Union Market DC", dest: "Lincoln Memorial", cost: "교통 버스/지하철" },
              { time: "19:00", title: "올드 에빗 그릴 굴 플래터", origin: "Lincoln Memorial", dest: "Old Ebbitt Grill Washington DC", cost: "식비 $30" }

    ];

    let currentRouteIndex = 0;

    function renderTabs() {
      const container = document.getElementById('routeTabs');
      container.innerHTML = routesData.map((route, idx) => {
        const isActive = idx === currentRouteIndex;
        return `
          <button onclick="selectRoute(${idx})" 
            class="flex items-center gap-2 px-3 py-2 rounded-xl text-left border shrink-0 transition-all ${
              isActive 
                ? 'nav-tab-active bg-white border-indigo-600' 
                : 'bg-slate-50 border-slate-200 text-slate-500'
            }">
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
              isActive ? 'bg-indigo-600 text-white' : 'bg-slate-200 text-slate-400'
            }">${route.num}</div>
            <div class="pr-1">
              <div class="text-[12px] font-bold leading-tight ${isActive ? 'text-slate-900' : 'text-slate-600'}">${route.title}</div>
              <div class="text-[10px] ${isActive ? 'text-indigo-600 font-semibold' : 'text-slate-400'}">경비(1인): $${route.costs.totalPer}</div>
            </div>
          </button>
        `;
      }).join('');
    }

      const container = document.getElementById('mainContent');

            </div>
            <div>
              <h3 class="text-sm font-black text-slate-900">샌프란시스코 숙소 전략 (3안)</h3>
              <p class="text-[11px] text-slate-400 font-medium">유저 맞춤형 시나리오 장단점 분석</p>
            </div>
          </div>
          <div class="space-y-3">
            ${sfHotelScenarios.map(sc => `
              <div class="border border-${sc.color}-200 bg-${sc.color}-50/30 rounded-2xl p-4">
                <div class="flex justify-between items-start mb-1.5">
                  <h4 class="font-bold text-[13px] text-${sc.color}-800 leading-tight pr-2">${sc.title}</h4>
                  <span class="text-[10px] font-black text-white bg-${sc.color}-500 px-2 py-0.5 rounded shrink-0">${sc.cost}</span>
                </div>
                <div class="text-[11px] space-y-1.5 mt-2">
                  <div class="flex gap-1.5 text-slate-700">
                    <i class="fa-solid fa-circle-plus text-${sc.color}-500 mt-0.5"></i>
                    <span class="leading-relaxed"><strong class="font-semibold">장점:</strong> ${sc.pros}</span>
                  </div>
                  <div class="flex gap-1.5 text-slate-700">
                    <i class="fa-solid fa-circle-minus text-rose-500 mt-0.5"></i>
                    <span class="leading-relaxed"><strong class="font-semibold">단점:</strong> ${sc.cons}</span>
                  </div>
                </div>
              </div>
            `).join('')}

          </div>
        </div>
      ` : '';

      container.innerHTML = `
        <!-- Budget Card (식비+교통+명소 포함) -->
        <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-4">
          <div class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-bold">
            <i class="fa-solid fa-calculator"></i> ${r.tag} 예산 요약

            </div>
            <div class="space-y-1 text-xs text-slate-600">
              <div class="flex justify-between"><span>식비(Food):</span><span class="font-bold text-slate-900">$${r.costs.food}</span></div>
              <div class="flex justify-between"><span>현지 교통(Transit):</span><span class="font-bold text-slate-900">$${r.costs.trans}</span></div>
              <div class="flex justify-between"><span>명소(Attractions):</span><span class="font-bold text-slate-900">$${r.costs.attr}</span></div>

            <div class="border-t border-indigo-200/60 pt-2.5 mt-2.5 flex justify-between items-baseline">

            </div>
          </div>
        </div>

        ${sfHotelBlock}

        <!-- Schedule TimeLine Card -->
        <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm mt-4">
          <div class="flex items-center gap-2.5 mb-5">
            <div class="w-8 h-8 rounded-xl bg-rose-50 flex items-center justify-center text-rose-500 font-bold text-sm">
              <i class="fa-regular fa-clock"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-slate-900">시간별 동선 가이드</h3>
              <p class="text-[11px] text-slate-400 font-medium">이전 장소 ➔ 다음 장소 직결 내비게이션</p>
            </div>
          </div>

          ${r.schedules.map(sch => `

                ${sch.items.map(item => `
                  <div class="relative">
                    <div class="absolute w-[18px] h-[18px] bg-indigo-500 rounded-full -left-[30px] top-0 border-[4px] border-white shadow-sm"></div>

                    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 shadow-sm">
                      <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-[13px] text-slate-900 leading-tight pr-2">${item.title}</h4>
                        <span class="text-[10px] font-bold text-slate-500 bg-white px-1.5 py-0.5 rounded border border-slate-200 shrink-0 whitespace-nowrap">${item.cost}</span>

              </div>
            </div>
          `).join('')}
        </div>

        <!-- Alternatives Card -->
        <div class="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm space-y-4 mt-4">
          <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-amber-50 flex items-center justify-center text-amber-600 font-bold text-sm">
              <i class="fa-solid fa-list-ul"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-slate-900">다양한 대안 코스 & 맛집</h3>
              <p class="text-[11px] text-slate-400 font-medium">취향에 맞춰 스케줄을 변경하세요</p>
            </div>
          </div>

          <div class="space-y-2.5">
            ${r.alts.map(alt => `
              <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 border border-slate-100 transition hover:border-indigo-200">
                <div class="flex-1 pr-3">
                  <div class="flex items-center gap-1.5 mb-0.5">
                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600">${alt.type}</span>

                   class="w-9 h-9 shrink-0 rounded-full bg-white border border-slate-200 text-slate-400 flex items-center justify-center hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 shadow-sm transition">
                  <i class="fa-solid fa-location-dot text-sm"></i>
                </a>
              </div>

      `;
    }

    function selectRoute(index) {
      currentRouteIndex = index;
      renderTabs();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      renderTabs();
      renderContent();
    });
  </script>
</body>
