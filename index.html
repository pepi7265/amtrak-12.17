<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>미국 암트랙 대횡단 프로 마스터 플래너 V11</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f1f5f9; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .nav-tab-active {
      border: 2px solid #4f46e5 !important;
      background-color: #ffffff !important;
      color: #4f46e5 !important;
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.22);
      transform: translateY(-1px);
    }
    .tier-tab-active {
      background-color: #0f172a !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="text-slate-800 antialiased pb-32 select-none">

  <!-- Top Sticky Header -->
  <header class="bg-white/95 backdrop-blur-md sticky top-0 z-40 border-b border-slate-200 shadow-sm">
    <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
          <i class="fa-solid fa-train-subway text-lg"></i>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-base font-black text-slate-900 tracking-tight">US AMTRAK PRO</h1>
            <span class="text-[10px] font-black bg-indigo-600 text-white px-2 py-0.5 rounded-full">V11 EXPERT</span>
          </div>
          <p class="text-[10px] text-slate-500 font-medium">12/17~1/6 대횡단 • 원클릭 대안 삽입 • 치안/교통 완비</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="shareLink()" class="text-[11px] font-extrabold text-white bg-indigo-600 hover:bg-indigo-700 px-3 py-1.5 rounded-xl shadow-sm transition flex items-center gap-1">
          <i class="fa-solid fa-share-nodes"></i> 공유
        </button>
        <button onclick="resetToDefault()" title="원본 초기화" class="text-[11px] font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 px-2.5 py-1.5 rounded-xl border border-slate-200 transition">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>
    </div>

    <!-- Sub Status Bar -->
    <div class="bg-slate-900 text-slate-200 px-4 py-1.5">
      <div class="max-w-lg mx-auto flex items-center justify-between text-[10px] font-medium">
        <span><i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> 하단 <strong>[대안 카탈로그]</strong>에서 <strong>[+ 일정 넣기]</strong>로 즉시 추가/교체 가능!</span>
        <span class="text-emerald-400 font-bold shrink-0 ml-2">● 자동저장 ON</span>
      </div>
    </div>

    <!-- Horizontal City Tabs -->
    <div class="max-w-lg mx-auto px-4 py-2 bg-white">
      <div id="routeTabs" class="flex gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-lg mx-auto px-4 mt-3 space-y-4" id="mainContent"></main>

  <!-- Modal 1: Edit Existing Schedule Item -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
        <h3 class="text-sm font-black text-slate-900"><i class="fa-solid fa-pen-to-square text-indigo-600 mr-1"></i> 일정 세부 편집</h3>
        <button onclick="closeEditModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="editSchIdx">
      <input type="hidden" id="editItemIdx">
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">시간대</label>
          <input type="text" id="editTime" placeholder="13:00 - 14:30" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">치안 등급</label>
          <select id="editSafetyLevel" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="green">🟢 치안 양호</option>
            <option value="yellow">🟡 주의 필요</option>
            <option value="red">🔴 야간/위험 주의</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-[10px] font-extrabold text-slate-500">일정 제목 / 장소명</label>
        <input type="text" id="editItemTitle" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">이동 수단 & 소요시간</label>
          <input type="text" id="editDuration" placeholder="전철 20분 + 관람" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">예상 비용</label>
          <input type="text" id="editCost" placeholder="식비 $35" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <div>
        <label class="text-[10px] font-extrabold text-slate-500">치안 & 실전 꿀팁 메모</label>
        <input type="text" id="editSafety" class="w-full text-xs p-2 border border-slate-200 rounded-xl mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex items-center justify-between">
        <div>
          <div class="text-[11px] font-black text-slate-800"><i class="fa-solid fa-taxi text-amber-500 mr-1"></i> Uber / Lyft 원클릭 호출 버튼</div>
          <div class="text-[9px] text-slate-400">체크 시 카드 하단에 우버/리프트 앱 직행 버튼이 표시됩니다.</div>
        </div>
        <input type="checkbox" id="editNeedsRide" class="w-4 h-4 accent-indigo-600 rounded">
      </div>

      <div class="bg-indigo-50/60 p-3 rounded-2xl border border-indigo-100 space-y-2">
        <div class="text-[10px] font-black text-indigo-900"><i class="fa-solid fa-map-location-dot text-indigo-600 mr-1"></i> 구글 지도 실시간 연동</div>
        <div>
          <label class="text-[9px] font-bold text-slate-500">도착지 검색어 (필수)</label>
          <input type="text" id="editDest" class="w-full text-xs p-2 border border-slate-200 rounded-xl bg-white mt-0.5 outline-none">
        </div>
        <div>
          <label class="text-[9px] font-bold text-slate-500">출발지 검색어 (입력 시 A➔B 길찾기로 작동)</label>
          <input type="text" id="editOrigin" class="w-full text-xs p-2 border border-slate-200 rounded-xl bg-white mt-0.5 outline-none">
        </div>
      </div>

      <button onclick="saveModalChanges()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-2xl text-xs shadow-md transition">
        수정 완료 및 즉시 반영
      </button>
    </div>
  </div>

  <!-- Modal 2: Quick Insert / Swap Alternative Item into Schedule -->
  <div id="insertModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-sm p-5 space-y-3.5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-100 pb-2.5">
        <h3 class="text-sm font-black text-slate-900"><i class="fa-solid fa-calendar-plus text-indigo-600 mr-1"></i> 내 일정에 넣기 / 교체</h3>
        <button onclick="closeInsertModal()" class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="insTierKey">
      <input type="hidden" id="insAltIdx">

      <!-- Selected Alternative Preview -->
      <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl">
        <div class="flex justify-between items-start">
          <div class="text-xs font-black text-indigo-950" id="insPreviewName">장소명</div>
          <span class="text-[10px] font-extrabold bg-indigo-600 text-white px-2 py-0.5 rounded-md" id="insPreviewCost">$0</span>
        </div>
        <p class="text-[10px] text-indigo-700 mt-1" id="insPreviewDesc">설명</p>
      </div>

      <!-- Step 1: Select Day -->
      <div>
        <label class="text-[10px] font-extrabold text-slate-600 block mb-1">1. 어느 날짜에 넣을까요?</label>
        <select id="insDaySelect" onchange="updateReplaceDropdown()" class="w-full text-xs p-2.5 border border-slate-200 rounded-xl bg-slate-50 font-bold text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500"></select>
      </div>

      <!-- Step 2: Mode Selection (Add New vs Replace Existing) -->
      <div>
        <label class="text-[10px] font-extrabold text-slate-600 block mb-1">2. 추가 방식 선택</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" id="modeAddBtn" onclick="setInsertMode('add')" class="py-2 px-3 rounded-xl text-xs font-black border-2 border-indigo-600 bg-indigo-50 text-indigo-700">
            + 새 시간대에 추가
          </button>
          <button type="button" id="modeReplaceBtn" onclick="setInsertMode('replace')" class="py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-600">
            🔄 기존 일정과 교체
          </button>
        </div>
      </div>

      <!-- Mode A: New Time Input -->
      <div id="insAddBox" class="space-y-2">
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">희망 시간대 입력</label>
          <input type="text" id="insNewTime" value="18:00 - 19:30" class="w-full text-xs p-2.5 border border-slate-200 rounded-xl mt-1 font-bold outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <!-- Mode B: Replace Existing Dropdown -->
      <div id="insReplaceBox" class="hidden space-y-2">
        <div>
          <label class="text-[10px] font-extrabold text-slate-500">교체할 기존 일정을 선택하세요</label>

        </div>
      </div>

      <button onclick="confirmInsertAlternative()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-3 rounded-2xl text-xs shadow-md transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-check"></i> 일정표에 즉시 반영하기
      </button>
    </div>
  </div>

    // =========================================================================
    // STORAGE & INITIALIZATION
    // =========================================================================
    function loadUserData() {
      try {
        if (window.location.hash && window.location.hash.startsWith('#data=')) {
          const encoded = window.location.hash.replace('#data=', '');
          const decoded = decodeURIComponent(escape(atob(encoded)));
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed) && parsed.length > 0) {
            routesData = parsed;
            return;
          }
        }
      } catch (e) {
        console.warn("Hash decode error:", e);
      }

      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            routesData = parsed;
            return;
          }
        }
      } catch (e) {
        console.warn("LocalStorage error:", e);
      }

      routesData = JSON.parse(JSON.stringify(defaultRoutesData));
    }

    function saveUserDataLocally() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(routesData));
      } catch (e) {
        console.warn("Save failed:", e);
      }
    }

    function shareLink() {
      saveUserDataLocally();
      try {
        const jsonStr = JSON.stringify(routesData);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert('✅ 수정된 일정이 담긴 [공유 링크]가 클립보드에 복사되었습니다!\n\n동행인(친구)에게 카톡으로 붙여넣어 보내면 내가 추가/교체한 일정 그대로 똑같이 열립니다.');
          }).catch(() => {
            prompt('아래 공유 링크를 복사하여 친구에게 전달하세요:', shareUrl);
          });
        } else {
          prompt('아래 공유 링크를 복사하여 친구에게 전달하세요:', shareUrl);

      let total = 0;
      (items || []).forEach(it => {
        if (it.done) return;
        const match = (it.cost || '').match(/\$\s*(\d+(\.\d+)?)/);
        if (match) total += parseFloat(match[1]);
      });
      return Math.round(total);
    }

                        <div class="flex justify-between items-start gap-2">
                          <div>
                            <div class="flex items-center gap-1.5 flex-wrap">
                              <span class="text-[11px] font-black text-slate-900">${alt.name}</span>
                              ${alt.cost ? `<span class="text-[9px] font-extrabold px-1.5 py-0.2 rounded bg-slate-100 text-slate-700 border border-slate-200">${alt.cost}</span>` : ''}
                              ${alt.duration ? `<span class="text-[9px] font-semibold text-indigo-600">⏱️ ${alt.duration}</span>` : ''}
                            </div>
                            <p class="text-[10px] text-slate-600 mt-1 leading-snug">${alt.desc}</p>
                            ${alt.safetyNote ? `<p class="text-[9px] text-amber-700 font-medium mt-1">💡 ${alt.safetyNote}</p>` : ''}
                          </div>
                        </div>
                        <div class="flex items-center gap-1.5 pt-1 border-t border-slate-100">
                          <button onclick="openInsertModal('${tc.key}', ${altIdx})" 
                            class="flex-1 ${tc.btn} text-white text-[10px] font-black py-1.5 px-3 rounded-lg transition flex items-center justify-center gap-1 shadow-2xs">
                            <i class="fa-solid fa-plus"></i> 내 일정에 넣기 / 교체
                          </button>
                          <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(alt.dest || alt.name)}" target="_blank" 
                             class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold py-1.5 px-2.5 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-map-pin text-indigo-600"></i> 지도
                          </a>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // INTERACTIVE HANDLERS (Insert / Swap / Move / Edit)
    // =========================================================================
    function setTierFilter(tab) {
      currentTierTab = tab;
      renderContent();
    }

    function selectRoute(index) {
      currentRouteIndex = index;
      currentTierTab = 'all';
      renderTabs();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function moveItem(schIdx, itemIdx, dir) {
      const items = routesData[currentRouteIndex].schedules[schIdx].items;
      const targetIdx = itemIdx + dir;
      if (targetIdx < 0 || targetIdx >= items.length) return;
      const temp = items[itemIdx];
      items[itemIdx] = items[targetIdx];
      items[targetIdx] = temp;
      saveUserDataLocally();
      renderContent();
    }

    // --- Quick Insert / Replace Modal Logic ---
    function openInsertModal(tierKey, altIdx) {
      const r = routesData[currentRouteIndex];
      const alt = r.tiers[tierKey][altIdx];
      if (!alt) return;

      document.getElementById('insTierKey').value = tierKey;
      document.getElementById('insAltIdx').value = altIdx;
      document.getElementById('insPreviewName').textContent = alt.name;
      document.getElementById('insPreviewCost').textContent = alt.cost || '자유';
      document.getElementById('insPreviewDesc').textContent = alt.desc || '';

      // Populate Day Select
      const daySelect = document.getElementById('insDaySelect');
      daySelect.innerHTML = r.schedules.map((sch, idx) => `<option value="${idx}">${sch.day}</option>`).join('');

      setInsertMode('add');
      updateReplaceDropdown();
      document.getElementById('insertModal').classList.remove('hidden');
    }

    function closeInsertModal() {
      document.getElementById('insertModal').classList.add('hidden');
    }

    function setInsertMode(mode) {
      currentInsertMode = mode;
      const addBtn = document.getElementById('modeAddBtn');
      const repBtn = document.getElementById('modeReplaceBtn');
      const addBox = document.getElementById('insAddBox');
      const repBox = document.getElementById('insReplaceBox');

      if (mode === 'add') {
        addBtn.className = 'py-2 px-3 rounded-xl text-xs font-black border-2 border-indigo-600 bg-indigo-50 text-indigo-700';
        repBtn.className = 'py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-600';
        addBox.classList.remove('hidden');
        repBox.classList.add('hidden');
      } else {
        repBtn.className = 'py-2 px-3 rounded-xl text-xs font-black border-2 border-indigo-600 bg-indigo-50 text-indigo-700';
        addBtn.className = 'py-2 px-3 rounded-xl text-xs font-bold border border-slate-200 bg-white text-slate-600';
        addBox.classList.add('hidden');
        repBox.classList.remove('hidden');
      }
    }

    function updateReplaceDropdown() {
      const r = routesData[currentRouteIndex];
      const dayIdx = parseInt(document.getElementById('insDaySelect').value) || 0;
      const items = (r.schedules[dayIdx] && r.schedules[dayIdx].items) ? r.schedules[dayIdx].items : [];
      const repSelect = document.getElementById('insReplaceTarget');
      repSelect.innerHTML = items.map((it, idx) => `<option value="${idx}">[${it.time}] ${it.title}</option>`).join('');
    }

    function confirmInsertAlternative() {
      const r = routesData[currentRouteIndex];
      const tierKey = document.getElementById('insTierKey').value;
      const altIdx = parseInt(document.getElementById('insAltIdx').value);
      const dayIdx = parseInt(document.getElementById('insDaySelect').value) || 0;
      const alt = r.tiers[tierKey][altIdx];
      if (!alt) return;

      const badgeLabel = tierKey === 'shopping' ? '[쇼핑-대안]' : tierKey === 'premium' ? '[프리미엄]' : '[추천-대안]';

      if (currentInsertMode === 'add') {
        const timeStr = document.getElementById('insNewTime').value || '자유시간';
        r.schedules[dayIdx].items.push({
          time: timeStr,
          title: `${badgeLabel} ${alt.name}`,
          origin: '',
          dest: alt.dest || alt.name,
          cost: alt.cost || '자유',
          duration: alt.duration || '약 1시간',
          safetyLevel: alt.safetyLevel || 'green',
          safetyNote: alt.safetyNote || alt.desc || '',
          needsRide: !!alt.needsRide,
          done: false
        });
      } else {
        const targetItemIdx = parseInt(document.getElementById('insReplaceTarget').value);
        if (!isNaN(targetItemIdx) && r.schedules[dayIdx].items[targetItemIdx]) {
          const prev = r.schedules[dayIdx].items[targetItemIdx];
          r.schedules[dayIdx].items[targetItemIdx] = {
            time: prev.time, // Keep existing time slot
            title: `${badgeLabel} ${alt.name}`,
            origin: prev.origin || '',
            dest: alt.dest || alt.name,
            cost: alt.cost || prev.cost,
            duration: alt.duration || prev.duration,
            safetyLevel: alt.safetyLevel || 'green',
            safetyNote: alt.safetyNote || alt.desc || '',
            needsRide: !!alt.needsRide,
            done: false
          };
        }
      }

      saveUserDataLocally();
      closeInsertModal();
      renderContent();
    }

    // --- Edit Existing Item Modal Logic ---
    function openEditModal(schIdx, itemIdx) {
      const item = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      document.getElementById('editSchIdx').value = schIdx;
      document.getElementById('editItemIdx').value = itemIdx;
      document.getElementById('editTime').value = item.time || '';
      document.getElementById('editSafetyLevel').value = item.safetyLevel || 'green';
      document.getElementById('editItemTitle').value = item.title || '';
      document.getElementById('editCost').value = item.cost || '';
      document.getElementById('editDuration').value = item.duration || '';
      document.getElementById('editSafety').value = item.safetyNote || '';
      document.getElementById('editNeedsRide').checked = !!item.needsRide;
      document.getElementById('editOrigin').value = item.origin || '';
      document.getElementById('editDest').value = item.dest || item.title || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveModalChanges() {
      const schIdx = parseInt(document.getElementById('editSchIdx').value);
      const itemIdx = parseInt(document.getElementById('editItemIdx').value);
      const targetItem = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      
      targetItem.time = document.getElementById('editTime').value;
      targetItem.safetyLevel = document.getElementById('editSafetyLevel').value;
      targetItem.title = document.getElementById('editItemTitle').value;
      targetItem.cost = document.getElementById('editCost').value;
      targetItem.duration = document.getElementById('editDuration').value;
      targetItem.safetyNote = document.getElementById('editSafety').value;
      targetItem.needsRide = document.getElementById('editNeedsRide').checked;
      targetItem.origin = document.getElementById('editOrigin').value;
      targetItem.dest = document.getElementById('editDest').value;

      saveUserDataLocally();
      closeEditModal();
      renderContent();
    }

    function deleteItem(schIdx, itemIdx) {
      if (confirm('이 일정을 삭제하시겠습니까?')) {
        routesData[currentRouteIndex].schedules[schIdx].items.splice(itemIdx, 1);
        saveUserDataLocally();
        renderContent();
      }
    }

    function toggleDone(schIdx, itemIdx) {
      const targetItem = routesData[currentRouteIndex].schedules[schIdx].items[itemIdx];
      targetItem.done = !targetItem.done;
      saveUserDataLocally();
      renderContent();
    }

    function addItemPrompt(schIdx) {
      const title = prompt('추가할 일정 제목 또는 장소명을 입력하세요:');
      if (!title) return;
      const time = prompt('시간대를 입력하세요 (예: 18:00 - 19:30):', '18:00 - 19:30');
      const cost = prompt('예상 비용을 입력하세요 (예: 식비 $25):', '$20');

      routesData[currentRouteIndex].schedules[schIdx].items.push({
        time: time || '자유시간',
        title: title,
        cost: cost || '$0',
        duration: '약 1시간',
        safetyLevel: 'green',
        safetyNote: '구글 지도 위치 자동 연동됨',
        needsRide: false,
        origin: '',
        dest: title,
        done: false
      });

      saveUserDataLocally();
      renderContent();
    }

    window.onload = function() {
      loadUserData();
      renderTabs();
      renderContent();
    };
  </script>
</body>
</html>
