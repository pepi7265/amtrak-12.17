<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>미국 대횡단 트래블 플래너 V14</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: #f5f7fa;
      color: #191f28;
      letter-spacing: -0.02em;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Clean Bright UI States */
    .city-tab-active {
      background-color: #2563eb !important;
      color: #ffffff !important;
      border-color: #2563eb !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.22);
    }

    .sub-tab-active {
      color: #2563eb !important;
      border-bottom: 3px solid #2563eb !important;
      font-weight: 800 !important;
    }

    .day-chip-active {
      background-color: #191f28 !important;
      color: #ffffff !important;
      border-color: #191f28 !important;
    }

    .clean-card {
      background: #ffffff;
      border: 1px solid #e5e8eb;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    /* Map Pin Styling */
    .route-pin {
      background: #2563eb;
      color: #ffffff;
      border: 2.5px solid #ffffff;
      border-radius: 9999px;
      font-weight: 900;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.45);
    }
  </style>
</head>
<body class="antialiased pb-32">

  <!-- ================= BRIGHT CLEAN STICKY HEADER ================= -->
  <header class="bg-white sticky top-0 z-40 border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-4 pt-3.5 pb-2">
      
      <!-- Top Bar -->
      <div class="flex items-center justify-between gap-2 mb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white shadow-sm shrink-0">
            <i class="fa-solid fa-map-location-dot text-lg"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-black text-slate-900 tracking-tight">미국 암트랙 대횡단 플래너</h1>
              <span class="text-xs font-extrabold bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md border border-blue-200">21일 풀코스</span>
            </div>
            <p class="text-xs text-slate-500 font-medium">2026.12.17 ~ 2027.01.06 • 샌프란시스코 ➔ 뉴욕 ➔ 워싱턴 D.C.</p>
          </div>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="shareLink()" class="text-xs font-extrabold text-white bg-blue-600 hover:bg-blue-700 px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-2xs">
            <i class="fa-solid fa-link"></i> 일정 공유
          </button>
          <button onclick="resetToDefault()" title="초기화" class="text-xs font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 px-2.5 py-2 rounded-xl border border-slate-200 transition">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </div>

      <!-- 7 Cities Selector -->
      <div id="routeTabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-2"></div>
    </div>

    <!-- 5 Separated View Tabs (Clean Underline Style) -->
    <div class="bg-white border-t border-slate-100 px-4">
      <div class="max-w-3xl mx-auto flex overflow-x-auto no-scrollbar gap-5 text-sm">
        <button onclick="setMainView('schedule')" id="vTab-schedule" class="py-2.5 shrink-0 text-slate-500 hover:text-slate-900 transition sub-tab-active">
          🗺️ 동선 지도 & 일정표
        </button>
        <button onclick="setMainView('alternatives')" id="vTab-alternatives" class="py-2.5 shrink-0 text-slate-500 hover:text-slate-900 font-semibold transition">
          ✨ 대안 장소 보관함
        </button>
        <button onclick="setMainView('shopping')" id="vTab-shopping" class="py-2.5 shrink-0 text-slate-500 hover:text-slate-900 font-semibold transition">
          🧥 아웃도어·폴로 쇼핑
        </button>
        <button onclick="setMainView('transit')" id="vTab-transit" class="py-2.5 shrink-0 text-slate-500 hover:text-slate-900 font-semibold transition">
          🚇 교통패스 가이드
        </button>
        <button onclick="setMainView('safety')" id="vTab-safety" class="py-2.5 shrink-0 text-slate-500 hover:text-slate-900 font-semibold transition">
          🛡️ 치안 & 짐보관
        </button>
      </div>
    </div>
  </header>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="max-w-3xl mx-auto px-4 mt-4 space-y-4" id="mainContent"></main>

  <!-- ================= MODAL 1: EDIT / ADD WITH LIVE MAP SEARCH ================= -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg p-5 sm:p-6 space-y-4 shadow-2xl max-h-[92vh] overflow-y-auto border border-slate-200">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <div>
          <h3 class="text-base sm:text-lg font-black text-slate-900" id="editModalHeader">일정 수정 및 장소 검색</h3>
          <p class="text-xs text-slate-500 font-medium">장소를 검색해 선택하면 이름·주소·동선 좌표가 자동 입력됩니다.</p>
        </div>
        <button onclick="closeEditModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <input type="hidden" id="editSchIdx">
      <input type="hidden" id="editItemIdx">
      <input type="hidden" id="editLat">
      <input type="hidden" id="editLng">

      <!-- LIVE PLACE SEARCH BOX (Auto-fill) -->
      <div class="bg-blue-50/70 border border-blue-200 p-3.5 rounded-2xl space-y-2.5">
        <label class="text-xs font-extrabold text-blue-900 flex items-center gap-1.5">
          <i class="fa-solid fa-magnifying-glass-location text-blue-600"></i> 구글/지도 장소 검색 (선택 시 자동 입력)
        </label>
        <div class="flex gap-2">
          <input type="text" id="placeSearchInput" onkeydown="if(event.key==='Enter'){event.preventDefault(); searchPlacesLive();}" placeholder="장소명 입력 (예: Shake Shack, Polo, Target...)" class="flex-1 text-sm p-2.5 border border-blue-200 rounded-xl bg-white outline-none focus:border-blue-600">
          <button type="button" onclick="searchPlacesLive()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 rounded-xl shrink-0 transition">
            검색
          </button>
        </div>
        <div id="placeSearchResults" class="hidden max-h-44 overflow-y-auto bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 shadow-sm"></div>
      </div>

      <!-- Schedule Fields -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-slate-600">진행 시간대</label>
          <input type="text" id="editTime" placeholder="예: 13:00 - 14:30" class="w-full text-sm font-bold p-2.5 border border-slate-200 rounded-xl mt-1 outline-none focus:border-blue-600">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">치안 상태</label>
          <select id="editSafetyLevel" class="w-full text-sm font-bold p-2.5 border border-slate-200 rounded-xl mt-1 bg-white outline-none">
            <option value="G">🟢 안심 구역</option>
            <option value="Y">🟡 소지품/야간 주의</option>
            <option value="R">🔴 위험/접근 주의</option>
          </select>
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-600">일정 제목 / 장소명</label>
        <input type="text" id="editItemTitle" class="w-full text-sm font-bold p-2.5 border border-slate-200 rounded-xl mt-1 outline-none focus:border-blue-600">
      </div>

      <div class="grid grid-cols-3 gap-2.5">
        <div>
          <label class="text-xs font-bold text-slate-600">이동 수단·시간</label>
          <input type="text" id="editMoveTime" placeholder="전철 15분" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl mt-1 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">장소 체류시간</label>
          <input type="text" id="editStayTime" placeholder="관람 1.5시간" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl mt-1 outline-none">
        </div>
        <div>
          <label class="text-xs font-bold text-slate-600">예상 비용</label>
          <input type="text" id="editCost" placeholder="식비 $30" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl mt-1 outline-none">
        </div>
      </div>

      <div>
        <label class="text-xs font-bold text-slate-600">실전 팁 & 메모</label>
        <textarea id="editSafety" rows="2" class="w-full text-sm p-2.5 border border-slate-200 rounded-xl mt-1 outline-none"></textarea>
      </div>

      <!-- Map Address & Live Google Map Embed Preview -->
      <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-slate-700"><i class="fa-solid fa-location-dot text-blue-600 mr-1"></i>지도 연동 주소</span>
          <label class="text-xs font-bold text-slate-600 flex items-center gap-1.5 cursor-pointer">
            <input type="checkbox" id="editNeedsRide" class="w-4 h-4 accent-blue-600 rounded"> 우버/리프트 버튼 표시
          </label>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input type="text" id="editOrigin" placeholder="출발지 (선택)" class="text-xs p-2 border border-slate-200 rounded-lg bg-white outline-none">
          <input type="text" id="editDest" onchange="updateModalMapPreview()" placeholder="도착지 장소명 (필수)" class="text-xs p-2 border border-slate-200 rounded-lg bg-white outline-none">
        </div>
        <!-- Embedded Google Map Preview -->
        <div id="modalMapPreviewBox" class="rounded-xl overflow-hidden border border-slate-200 h-36 bg-slate-100">
          <iframe id="modalMapIframe" class="w-full h-full border-0" loading="lazy"></iframe>
        </div>
      </div>

      <button onclick="saveModalChanges()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-sm transition">
        저장하고 동선 지도에 반영하기
      </button>
    </div>
  </div>

  <!-- ================= MODAL 2: SWAP WITH ALTERNATIVE ================= -->
  <div id="swapModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-lg p-5 sm:p-6 space-y-4 shadow-2xl max-h-[88vh] flex flex-col border border-slate-200">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 shrink-0">
        <div>
          <h3 class="text-base sm:text-lg font-black text-slate-900" id="swapModalTitle">대안 장소로 교체 / 추가</h3>
          <p class="text-xs text-slate-500 font-medium mt-0.5" id="swapModalSubtitle">원하는 장소를 선택하면 일정과 동선 지도가 자동 업데이트됩니다.</p>
        </div>
        <button onclick="closeSwapModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="swapTargetSelectorBox" class="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl space-y-2 shrink-0">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">1. 날짜 선택</label>
            <select id="swapDaySelect" onchange="populateSwapTargetItems()" class="w-full text-xs sm:text-sm p-2 border border-slate-200 rounded-xl bg-white font-bold text-slate-800 outline-none"></select>
          </div>
          <div>
            <label class="text-xs font-bold text-slate-600 block mb-1">2. 추가 또는 기존 일정 교체</label>
            <select id="swapItemSelect" class="w-full text-xs sm:text-sm p-2 border border-slate-200 rounded-xl bg-white font-bold text-slate-800 outline-none"></select>
          </div>
        </div>
      </div>

      <div id="swapModalList" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'amtrak_v14_light_master';
    let currentRouteIndex = 0;
    let currentMainView = 'schedule'; // 'schedule' | 'alternatives' | 'shopping' | 'transit' | 'safety'
    let currentDayIndex = 0; // Active day index within the selected city
    let leafletMap = null;
    let isAddingNewItem = false;

    // Builder functions with explicit Move Time, Stay Time, and Coordinates [lat, lng]
    const I = (time, title, origin, dest, cost, moveTime, stayTime, safetyLevel, safetyNote, lat, lng, needsRide=false) => ({
      time, title, origin, dest, cost, moveTime, stayTime, safetyLevel, safetyNote, lat, lng, needsRide, done: false
    });
    const A = (name, desc, cost, moveTime, stayTime, dest, lat, lng, safetyLevel='G', safetyNote='', needsRide=false) => ({
      name, desc, cost, moveTime, stayTime, dest, lat, lng, safetyLevel, safetyNote, needsRide
    });

    const makeUberUrl = (dest) => `https://m.uber.com/ul/?action=setPickup&dropoff[formatted_address]=${encodeURIComponent(dest || '')}`;
    const makeLyftUrl = (dest) => `https://lyft.com/ride?id=lyft&destination[address]=${encodeURIComponent(dest || '')}`;
    const makeMapUrl = (origin, dest) => {
      if (!dest || dest.trim() === '') return null;
      if (origin && origin.trim() !== '') {
        return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin.trim())}&destination=${encodeURIComponent(dest.trim())}`;
      }
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest.trim())}`;
    };

    const getSafetyBadge = (lvl) => {
      if (lvl === 'G') return '<span class="text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md">🟢 치안양호</span>';
      if (lvl === 'Y') return '<span class="text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md">🟡 주의필요</span>';
      if (lvl === 'R') return '<span class="text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md">🔴 위험주의</span>';
      return '';
    };

    // Outdoor & Classic Menswear Shopping Data
    const shoppingBibleData = [
      { brand: "Polo Ralph Lauren (폴로 랄프로렌)", krPrice: "아우터 45~70만원", usPrice: "아우터 $80~$140 / 니트 $39~$55", target: "패딩 재킷, 코듀로이/해링턴 재킷, 하프집업, 케이블 니트, 볼캡", bestSpots: "① 시카고 Fashion Outlets (물량 최다) ② 뉴저지 Jersey Gardens (세금 0%) ③ 포틀랜드 Ross/Rack (세금 0%)" },
      { brand: "Levi's (리바이스)", krPrice: "청바지 15만원 / 트러커 20만원", usPrice: "청바지 $29~$45 / 양털 트러커 $49~$65", target: "501/505 오리지널 데님, 셰르파(양털 안감) 트러커 재킷", bestSpots: "① 시카고 Fashion Outlets ② 뉴저지 Jersey Gardens (세금 0%) ③ 샌프란시스코 본사 매장" },
      { brand: "Calvin Klein (캘빈클라인)", krPrice: "드로즈 3팩 10만원 / 패딩 25만원", usPrice: "드로즈 3팩 $16~$22 / 아우터 $35~$55", target: "남성 모달/코튼 드로즈 3팩, 경량 패딩, 데님 재킷", bestSpots: "① 포틀랜드 Cascades Station (Ross/TJ Maxx가 최저가) ② 시카고/뉴저지 CK Factory Store" },
      { brand: "Columbia (컬럼비아 - 포틀랜드 본사)", krPrice: "옴니히트 패딩/방수재킷 35만원", usPrice: "옴니히트 재킷 $45~$79 / 플리스 $25", target: "옴니히트(Omni-Heat) 다운, 방수 등산 재킷, 스냅 플리스", bestSpots: "① 포틀랜드 다운타운 플래그십 & 아울렛 (세금 0%) ② 시카고/뉴저지 Columbia Factory" },
      { brand: "The North Face (노스페이스)", krPrice: "눕시/고어텍스 재킷 40~55만원", usPrice: "아우터 $90~$160 / 플리스 $39~$55", target: "미국판 눕시, 마운틴 고어텍스 재킷, 데날리 플리스", bestSpots: "① 시카고 Fashion Outlets ② 뉴저지 Jersey Gardens (세금 0% 노스페이스 아울렛)" },
      { brand: "Arc'teryx & Patagonia (아크테릭스·파타고니아)", krPrice: "아톰/베타 55~90만원 / 레트로X 35만원", usPrice: "아울렛/노택스 체감 35~50% 절감", target: "아크테릭스 아톰 후디/비니, 파타고니아 레트로X/신칠라", bestSpots: "① 시카고 Fashion Outlets (아크테릭스 공식 아울렛 입점!) ② 포틀랜드 NW 23번가 직영점 (세금 0%)" },
      { brand: "Carhartt & Tommy Hilfiger (칼하트·타미)", krPrice: "칼하트 재킷 35만원", usPrice: "칼하트 덕 재킷 $75~$110 / 타미 패딩 $55", target: "칼하트 액티브/디트로이트 재킷, 타미 헤비 다운 파카", bestSpots: "① 포틀랜드 Cascades Station ② 시카고 & 뉴저지 아울렛" }
    ];

    // =========================================================================
    // 7 CITIES MASTER DATA (With Accurate Coordinates & Split Move/Stay Times)
    // =========================================================================
    const defaultRoutesData = [
      // 1. SAN FRANCISCO
      {
        id: "route1", num: 1, title: "샌프란시스코", badge: "SFC 버스출발", dateRange: "12/17 ~ 12/18",
        hotel: "Hilton San Francisco Financial District (750 Kearny St)",
        hotelCoords: [37.7946, -122.4048],
        proBriefing: "숙소(힐튼)는 차이나타운과 금융지구 경계에 있어 도보 이동이 매우 편합니다. 유니언스퀘어 서쪽 텐더로인(Tenderloin) 구역만 피하세요. 12/18 밤 기차는 숙소 근처 Salesforce Transit Center(SFC)에서 20:50 암트랙 전용 연계 버스(#5014)를 타면 에머리빌역 기차(#14) 바로 앞까지 안전하게 연결됩니다.",
        safetyOverview: "🟢 피어39·페리빌딩·차이나타운·노스비치(낮) 안전 | 🔴 텐더로인(Tenderloin)·마켓St 6~8가 절대 진입 금지",

    let routesData = [];

    // =========================================================================
    // STORAGE & SHARE
    // =========================================================================
    function loadUserData() {
      try {
        if (window.location.hash && window.location.hash.startsWith('#data=')) {
          const encoded = window.location.hash.replace('#data=', '');
          const decoded = decodeURIComponent(escape(atob(encoded)));
          const parsed = JSON.parse(decoded);
          if (Array.isArray(parsed) && parsed.length > 0) { routesData = parsed; return; }
        }
      } catch (e) {}
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) { routesData = parsed; return; }
        }
      } catch (e) {}
      routesData = JSON.parse(JSON.stringify(defaultRoutesData));
    }

    function saveUserDataLocally() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(routesData)); } catch (e) {}
    }

    function shareLink() {
      saveUserDataLocally();
      try {
        const jsonStr = JSON.stringify(routesData);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        const shareUrl = `${window.location.origin}${window.location.pathname}#data=${encoded}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(() => {
            alert('✅ 수정된 일정과 지도 좌표가 담긴 [공유 링크]가 복사되었습니다!\n동행인에게 보내면 동일한 화면이 열립니다.');
          }).catch(() => prompt('아래 링크를 복사하세요:', shareUrl));
        } else {
          prompt('아래 링크를 복사하세요:', shareUrl);
        }
      } catch (e) { alert('공유 링크 생성 실패'); }
    }

    function resetToDefault() {
      if (confirm('수정한 일정을 모두 초기화하고 기본 일정으로 되돌리시겠습니까?')) {
        try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
        window.location.hash = '';
        routesData = JSON.parse(JSON.stringify(defaultRoutesData));
        renderTabs();
        renderContent();
      }
    }

    function calcDayCost(items) {
      let total = 0;
      (items || []).forEach(it => {
        if (it.done) return;
        const m = (it.cost || '').match(/\$\s*(\d+(\.\d+)?)/);
        if (m) total += parseFloat(m[1]);
      });
      return Math.round(total);
    }

    // =========================================================================
    // NAVIGATION & TABS
    // =========================================================================
    function selectRoute(idx) {
      currentRouteIndex = idx;
      currentDayIndex = 0;
      renderTabs();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setMainView(view) {
      currentMainView = view;
      ['schedule', 'alternatives', 'shopping', 'transit', 'safety'].forEach(v => {
        const btn = document.getElementById(`vTab-${v}`);
        if (!btn) return;
        if (v === view) {
          btn.className = 'py-2.5 shrink-0 text-slate-900 transition sub-tab-active';
        } else {
          btn.className = 'py-2.5 shrink-0 text-slate-500 hover:text-slate-900 font-semibold transition';
        }
      });
      renderContent();
    }

    function selectDay(dayIdx) {
      currentDayIndex = dayIdx;
      renderContent();
    }

    function renderTabs() {
      const container = document.getElementById('routeTabs');
      if (!container) return;
      container.innerHTML = routesData.map((r, idx) => {
        const active = idx === currentRouteIndex;
        return `
          <button onclick="selectRoute(${idx})" 
            class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-left border shrink-0 transition ${
              active 
                ? 'city-tab-active' 
                : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
            }">
            <span class="w-5 h-5 rounded-full flex items-center justify-center text-xs font-black ${
              active ? 'bg-white text-blue-600' : 'bg-slate-200 text-slate-600'
            }">${r.num}</span>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-sm font-extrabold">${r.title}</span>
              </div>
              <div class="text-[11px] ${active ? 'text-blue-100' : 'text-slate-400'} font-medium">${r.dateRange}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    // =========================================================================
    // INTERACTIVE ROUTE MAP (LEAFLET + CARTO VOYAGER LIGHT TILES)
    // =========================================================================
    function initDayRouteMap() {
      const mapEl = document.getElementById('dayRouteMap');
      if (!mapEl) return;

      if (leafletMap) {
        leafletMap.remove();
        leafletMap = null;
      }

      const r = routesData[currentRouteIndex];
      const sch = r.schedules[currentDayIndex] || r.schedules[0];
      const items = (sch && sch.items) ? sch.items : [];

      const defaultCenter = r.hotelCoords || [39.8283, -98.5795];
      leafletMap = L.map('dayRouteMap', { scrollWheelZoom: false }).setView(defaultCenter, 13);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
      }).addTo(leafletMap);

      const latLngs = [];

      items.forEach((it, idx) => {
        if (it.lat && it.lng) {
          const pt = [parseFloat(it.lat), parseFloat(it.lng)];
          latLngs.push(pt);

          const icon = L.divIcon({
            className: 'route-pin',
            html: `<span>${idx + 1}</span>`,
            iconSize: [28, 28],
            iconAnchor: [14, 14]
          });

          const marker = L.marker(pt, { icon }).addTo(leafletMap);
          marker.bindPopup(`
            <div style="font-family:Pretendard,sans-serif; min-width:170px;">
              <div style="font-size:11px; font-weight:800; color:#2563eb;">#${idx + 1} · ${it.time}</div>
              <div style="font-size:13px; font-weight:800; color:#191f28; margin-top:2px;">${it.title}</div>
              <div style="font-size:11px; color:#4e5968; margin-top:4px;">이동: ${it.moveTime || '-'} | 체류: ${it.stayTime || '-'}</div>
            </div>
          `);
        }
      });

      if (latLngs.length > 1) {
        L.polyline(latLngs, {
          color: '#2563eb',
          weight: 4,
          opacity: 0.75,
          dashArray: '8, 8'
        }).addTo(leafletMap);
        leafletMap.fitBounds(latLngs, { padding: [35, 35], maxZoom: 15 });
      } else if (latLngs.length === 1) {
        leafletMap.setView(latLngs[0], 14);
      }
    }

    function focusPinOnMap(lat, lng, idx) {
      if (!leafletMap || !lat || !lng) return;
      document.getElementById('dayRouteMap').scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => {
        leafletMap.setView([lat, lng], 16, { animate: true });
      }, 250);
    }

    // =========================================================================
    // LIVE PLACE SEARCH & AUTO-FILL IN MODAL (OpenStreetMap Nominatim + Presets)
    // =========================================================================
    async function searchPlacesLive() {
      const q = document.getElementById('placeSearchInput').value.trim();
      const resBox = document.getElementById('placeSearchResults');
      if (!q) return;

      resBox.classList.remove('hidden');
      resBox.innerHTML = `<div class="p-3 text-xs text-slate-500">🔍 '${q}' 위치를 검색 중입니다...</div>`;

      const r = routesData[currentRouteIndex];
      const cityKeyword = r.title.split('(')[0].trim();

      // 1. Search built-in curated database first
      const localMatches = [];
      Object.values(r.tiers || {}).flat().forEach(alt => {
        if (alt.name.toLowerCase().includes(q.toLowerCase()) || alt.dest.toLowerCase().includes(q.toLowerCase())) {
          localMatches.push({
            title: alt.name,
            address: alt.dest,
            lat: alt.lat,
            lng: alt.lng,
            badge: '추천장소'
          });
        }
      });

      // 2. Query OpenStreetMap Nominatim API for any place in the US
      let apiMatches = [];
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ' ' + r.hotel.split('(')[0])}&countrycodes=us&limit=6`;
        const resp = await fetch(url, { headers: { 'Accept-Language': 'en,ko' } });
        let data = await resp.json();
        if (!data || data.length === 0) {
          const url2 = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=6`;
          const resp2 = await fetch(url2, { headers: { 'Accept-Language': 'en,ko' } });
          data = await resp2.json();
        }
        apiMatches = (data || []).map(d => ({
          title: d.display_name.split(',')[0],
          address: d.display_name.split(',').slice(0, 3).join(','),
          lat: parseFloat(d.lat),
          lng: parseFloat(d.lon),
          badge: '지도검색'
        }));
      } catch (e) {}

      const combined = [...localMatches, ...apiMatches];
      if (combined.length === 0) {
        resBox.innerHTML = `
          <div class="p-3 text-xs text-slate-600 flex items-center justify-between">
            <span>검색 결과 직접 적용: <strong>${q}</strong></span>
            <button type="button" onclick="selectSearchedPlace('${q.replace(/'/g, "")}', '${q.replace(/'/g, "")}', ${r.hotelCoords[0]}, ${r.hotelCoords[1]})" class="bg-blue-600 text-white px-2.5 py-1 rounded-lg font-bold">바로 입력</button>
          </div>
        `;
        return;
      }

      resBox.innerHTML = combined.map((m, i) => `
        <button type="button" onclick="selectSearchedPlace('${m.title.replace(/'/g, "")}', '${m.address.replace(/'/g, "")}', ${m.lat}, ${m.lng})" 
          class="w-full text-left p-2.5 hover:bg-blue-50 transition flex items-center justify-between gap-2">
          <div>
            <div class="text-xs font-extrabold text-slate-900">${m.title}</div>
            <div class="text-[11px] text-slate-500 truncate max-w-xs">${m.address}</div>
          </div>
          <span class="text-[10px] font-bold bg-blue-50 text-blue-600 px-2 py-0.5 rounded border border-blue-200 shrink-0">자동입력</span>
        </button>
      `).join('');
    }

                </div>
                <button onclick="applyAlternativeToSchedule(${targetSchIdx}, ${targetItemIdx}, '${g.key}', ${altIdx}); closeSwapModal();" 
                  class="shrink-0 bg-blue-600 hover:bg-blue-700 text-white text-xs font-extrabold px-4 py-2 rounded-xl transition">
                  교체하기
                </button>
              </div>
            `).join('')}
          </div>
        `;
      }).join('');
    }

    function applyAlternativeToSchedule(schIdx, itemIdx, tierKey, altIdx) {
      const r = routesData[currentRouteIndex];
      const alt = r.tiers[tierKey][altIdx];
      if (!alt) return;

      if (itemIdx === -1) {
        const items = r.schedules[schIdx].items;
        const prevDest = items.length > 0 ? items[items.length - 1].dest : r.hotel;
        items.push(
          I("자유 시간", alt.name, prevDest, alt.dest || alt.name, alt.cost, alt.moveTime, alt.stayTime, alt.safetyLevel || "G", alt.safetyNote || alt.desc, alt.lat || r.hotelCoords[0], alt.lng || r.hotelCoords[1], !!alt.needsRide)
        );
      } else {
        const prev = r.schedules[schIdx].items[itemIdx];
        r.schedules[schIdx].items[itemIdx] = I(
          prev.time, alt.name, prev.origin || "", alt.dest || alt.name, alt.cost || prev.cost, alt.moveTime || prev.moveTime, alt.stayTime || prev.stayTime, alt.safetyLevel || "G", alt.safetyNote || alt.desc, alt.lat || prev.lat, alt.lng || prev.lng, !!alt.needsRide
        );
      }
      saveUserDataLocally();
      renderContent();
    }

    function closeSwapModal() {
      document.getElementById('swapModal').classList.add('hidden');
    }

    window.onload = function() {
      loadUserData();
      renderTabs();
      renderContent();
    };
  </script>
</body>
</html>
