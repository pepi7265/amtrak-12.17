    function sharePlan() {

          title: '암트랙 횡단 플래너 PRO',
          text: '미국 대륙 횡단 20박 21일 완벽 동선 가이드',
          url: window.location.href,
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('웹페이지 링크가 복사되었습니다!');
      }
    }
